[package]
name = "quotalume"
version = "0.1.0"
edition = "2024"
description = "A colorful, local-first AI quota monitor for the Linux status bar"
license = "MIT"
repository = "https://github.com/akrakcaan/quotalume"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
futures = "0.3"
ksni = "0.3.5"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["macros", "rt", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.24"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
